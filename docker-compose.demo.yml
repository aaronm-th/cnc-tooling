version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    container_name: timestamper_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - backend
    restart: always

  backend:
    build: .
    container_name: timestamper_backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env.demo
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.demo
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    volumes:
      - .:/app
      - ./data:/app/data
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: timestamper_celery_worker
    command: celery -A config worker --loglevel=info
    env_file: .env.demo
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.demo
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    volumes:
      - .:/app
      - ./data:/app/data
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - redis
      - backend

  celery_beat:
    build: .
    container_name: timestamper_celery_beat
    command: celery -A config beat -l info -s /app/data/celerybeat-schedule
    env_file: .env.demo
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.demo
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    volumes:
      - .:/app
      - ./data:/app/data
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - redis
      - backend

  redis:
    image: redis:7-alpine
    container_name: timestamper_redis
    restart: always

# WICHTIG: Hier muss 'static_volume:' und 'media_volume:' stehen (Mapping)
volumes:
  static_volume:
  media_volume: