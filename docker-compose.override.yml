
services:
  backend:
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend

  redis:
    ports:
      - "6379:6379"

  celery_worker:
    env_file: .env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=True
      - PYTHONPATH=/app
    depends_on:
      - backend

  celery_beat:
    env_file: .env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=True
      - PYTHONPATH=/app
    depends_on:
      - backend

  frontend:
    command: npm run dev
    ports:
      - "5173:5173"