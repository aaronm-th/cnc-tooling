services:
  redis:
    image: redis:7-alpine
    container_name: timestamper_redis
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timestamper_backend
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    depends_on:
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timestamper_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    depends_on:
      - redis
      - backend

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timestamper_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000  # Für den Build-Prozess
    environment:
      - VITE_API_URL=http://localhost:8000
    container_name: timestamper_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
