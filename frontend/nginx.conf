include /etc/nginx/mime.types;

server {
    listen 80;
    server_name localhost;

    # Aus deiner alten default.conf importiert (Wichtig für WeasyPrint/Große Uploads)
    client_max_body_size 20M;

    # 1. Statische Django-Dateien (Admin-Styles)
    location /static/ {
        alias /usr/share/nginx/html/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Hochgeladene Medien-Dateien (Logos, Bilder)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Django Admin-Bereich an das Backend weiterleiten
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # 4. Django API-Schnittstelle an das Backend weiterleiten
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # 5. Das Vue-Frontend als Fangnetz für alle normalen Seitenaufrufe
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}