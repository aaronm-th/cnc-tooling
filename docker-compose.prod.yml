services:
  db:
    image: postgres:15-alpine
    container_name: timestamper_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db

  celery_worker:
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - db

  celery_beat:
      restart: always
      env_file:
        - .env.prod
      command: celery -A config beat -l info -s /tmp/celerybeat-schedule
      depends_on:
        - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/usr/share/nginx/html/staticfiles:ro
      - media_volume:/usr/share/nginx/html/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume: