services:
  # 1. PostgreSQL (Neu für Produktion)
  db:
    image: postgres:15-alpine
    container_name: timestamper_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: timestamper_redis
    restart: always

  # 2. Backend über Gunicorn laufen lassen
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timestamper_backend
    restart: always
    # Überschreibt den runserver-Befehl mit Gunicorn (muss im requirements.txt stehen!)
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    container_name: timestamper_celery_worker
    restart: always
    command: celery -A config worker -l info
    env_file:
      - .env.prod
    depends_on:
      - redis
      - db

  celery_beat:
    build: ./backend
    container_name: timestamper_celery_beat
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env.prod
    depends_on:
      - redis
      - db

  # 3. Das Frontend via Nginx ausliefern
  frontend:
    build:
      context: ./frontend
      # Hier nutzen wir ein Multi-Stage Dockerfile (siehe unten)
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: timestamper_frontend
    restart: always
    ports:
      - "80:80" # Macht die Webapp im Heimnetzwerk unter http://<mini-pc-ip> erreichbar
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume: