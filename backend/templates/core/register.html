{% extends 'core/base.html' %}

{% block content %}
{% load static %}
<head>
  <title>Time Stamper | Register </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">

  
  <link rel="stylesheet" type="text/css" href="{% static 'css/register.css' %}">
  <link rel='stylesheet' href='https://use.fontawesome.com/releases/v5.2.0/css/all.css'>
  <link rel='stylesheet' href='https://use.fontawesome.com/releases/v5.2.0/css/fontawesome.css'>
  <link rel="stylesheet" type="text/css" href="{% static 'css/message_boxes.css' %}">

  <!-- Favicon icon -->
  <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" >

  <!-- Google fonts -->
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800%7CPlayfair+Display:400,700%7CRoboto:100,300,400,400i,500,700">


  <script  src="{% static 'js/ie-emulation-modes-warning.js' %}"></script>
</head>

<body>

    <section class="dashboard">
          <div class="container" style="padding:10px;">
    {% include 'core/includes/messages.html' %}

    <div class="screen">
      <div class="screen__content">
        
        <form class="login" action="{% url 'register' %}" method="post">
          {% csrf_token %}
          <div class="login__field">
            <i class="login__icon fas fa-user"></i>
            <input type="text" name="firstname" class="login__input" placeholder="Vorname" required>
          </div>

          <div class="login__field">
            <i class="login__icon fas fa-user"></i>
            <input type="text" name="lastname" class="login__input" placeholder="Nachname" required>
          </div>

          <div class="login__field">
            <i class="login__icon fas fa-envelope"></i>
            <input type="email" name="email" class="login__input" placeholder="E-Mail" required>
          </div>

          <div class="login__field">
            <i class="login__icon fas fa-lock"></i>
            <input type="password" name="password" class="login__input" placeholder="Passwort" required>
          </div>

          <div class="login__field">
            <i class="login__icon fas fa-lock"></i>
            <input type="password" name="confirm_password" class="login__input" placeholder="Passwort wiederholen" required>
          </div>
          

          <button class="button login__submit">
            <span class="button__text">Registrieren</span>
            <i class="button__icon fas fa-chevron-right"></i>
          </button>

        </form>

        </div>
        <div class="screen__background">
            <span class="screen__background__shape screen__background__shape4"></span>
            <span class="screen__background__shape screen__background__shape3"></span>		
            <span class="screen__background__shape screen__background__shape2"></span>
            <span class="screen__background__shape screen__background__shape1"></span>
        </div>		
        </div>
        </div>
    </section>

  
    
</body>

{% endblock %}
